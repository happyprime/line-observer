name: JavaScript tests

on:
  pull_request:
    # A change to another workflow file is no reason to run this one.
    paths:
      - '**'
      - '!.github/workflows/**'
      - .github/workflows/tests.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
